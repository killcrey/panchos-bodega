[build]
  command = "npm run build"
  publish = "dist"

# All VITE_-prefixed variables are intentionally inlined into the client
# bundle by Vite — that's the point of the prefix. Netlify's secrets scanner
# otherwise fails the build treating them as leaked secrets. Every key here
# is designed to be public and is protected by its own mechanism instead of
# secrecy: the Supabase anon key by Row Level Security, the Stripe key by
# being the publishable (not secret) key, and the Google Maps key by its
# HTTP referrer restriction. Never add a genuinely secret key (e.g. a
# Supabase service_role key) to this list or give it a VITE_ prefix.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_ANON_KEY,VITE_SUPABASE_URL,VITE_STRIPE_PUBLISHABLE_KEY,VITE_GOOGLE_MAPS_API_KEY"
  # SECRETS_SCAN_OMIT_KEYS above only covers the pattern-based scanner.
  # "Smart detection" is a separate heuristic pass that fails the build if
  # any Netlify-configured environment variable's VALUE literally appears in
  # the output — which every VITE_-prefixed variable does, by design. There's
  # no equivalent per-key allowlist for smart detection (only an omit-by-
  # value list, impractical to keep in sync with rotated keys), so it's
  # disabled outright rather than fighting false positives on values that
  # are supposed to ship to the browser.
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

# scripts/prerender-products.js writes a real static file per product at
# build time (dist/products/<slug>/index.html) — but that's a snapshot of
# the products table as of the last deploy. A product added, published, or
# given a slug for the first time *after* that deploy has no matching file
# on disk yet, and with no fallback rule, Netlify serves its own hard 404
# for that path instead of ever loading the app — confirmed live (a
# brand-new service product 404'd on refresh; an old one worked fine).
# Netlify serves a real file over a redirect whenever one exists at that
# exact path (no `force`), so this only ever applies to a path with no
# prerendered file — every existing product page keeps getting its real,
# per-product SEO'd HTML unchanged. For the gap case, this falls back to
# the SPA shell, which resolves the product from the live DB client-side
# (matchProductFromPath in main.js) instead of dead-ending on a 404 the
# instant a product is added and not yet deployed.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
